<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" fill="none" class="cofume-logo-svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap');
      .logo-brand-text {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .logo-sub-text {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        font-size: 15px;
      }
    </style>
  </defs>

  <!-- Cup Emblem centered at x=230, y=0..85 -->
  <g transform="translate(150, 4) scale(0.9)">
    <!-- Steam Plumes -->
    <path d="M78 10 C74 20 84 26 80 36 C77 42 73 44 72 48 C71 50 73 52 75 50 C79 46 83 42 85 36 C89 24 77 20 81 10 C82 7 80 7 78 10Z" fill="currentColor" opacity="0.95"/>
    <path d="M89 16 C86 23 93 27 90 35 C88 39 84 41 83 45 C82 47 84 48 86 46 C89 43 93 39 94 34 C97 25 88 21 91 16 C92 14 90 14 89 16Z" fill="currentColor" opacity="0.85"/>
    
    <!-- Cup Body -->
    <path d="M52 48 C52 48 56 80 86 80 C108 80 118 62 120 48 C110 52 98 54 86 54 C74 54 62 52 52 48Z" fill="currentColor"/>
    
    <!-- Cup Inner Rim -->
    <ellipse cx="86" cy="48" rx="34" ry="5.5" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Handle -->
    <path d="M115 50 C125 51 134 58 128 71 C124 79 113 75 108 71 C113 73 120 74 123 69 C127 61 121 55 113 53 Z" fill="currentColor"/>

    <!-- Saucer -->
    <path d="M48 85 C60 90 112 90 124 85 C118 88 98 92 86 92 C74 92 54 88 48 85Z" fill="currentColor"/>
  </g>

  <!-- Wordmark: COFUME -->
  <!-- Custom styled letters with signature 'F' sweep under 'U' -->
  <g class="logo-brand-text" fill="currentColor" transform="translate(230, 142)">
    <!-- C -->
    <text x="-165" y="0" font-size="52" text-anchor="middle">C</text>
    <!-- O -->
    <text x="-105" y="0" font-size="52" text-anchor="middle">O</text>
    <!-- F with stylized lower stroke -->
    <text x="-48" y="0" font-size="52" text-anchor="middle">F</text>
    <!-- Calligraphic flourish from F sweeping under U -->
    <path d="M -46 -6 Q -30 -10 -25 -2 C -18 8 -8 14 15 14 C 28 14 36 10 39 4 C 36 7 28 10 15 10 C -5 10 -14 4 -22 -4 Q -28 -12 -46 -6 Z" fill="currentColor"/>
    <!-- U -->
    <text x="12" y="0" font-size="52" text-anchor="middle">U</text>
    <!-- M -->
    <text x="80" y="0" font-size="52" text-anchor="middle">M</text>
    <!-- E -->
    <text x="145" y="0" font-size="52" text-anchor="middle">E</text>
  </g>

  <!-- Subtitle: — C A F E — -->
  <!-- Left hairline rule -->
  <line x1="75" y1="184" x2="165" y2="184" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  <!-- CAFE -->
  <text x="230" y="189" class="logo-sub-text" fill="currentColor" text-anchor="middle">C A F E</text>
  <!-- Right hairline rule -->
  <line x1="295" y1="184" x2="385" y2="184" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
</svg>

